<body>
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <img class="auth-brand-icon" src="icon-192.png" alt="BeatTag logo">
    <div class="auth-logo">BEAT<span>TAG</span></div>
    <h2 id="authTitle">Login</h2>

       white-space:nowrap;

    🪙 <span id="coinCount">0</span>
  </button>

  </button>

<script>
(function () {
  function hideDownloadInsideAndroidApp() {
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);

    // Android WebView commonly exposes "wv" or Version/4.0 in its UA.
    var isWebView =
      /\bwv\b/i.test(ua) ||
      /; wv\)/i.test(ua) ||
      (isAndroid && /Version\/4\.0/i.test(ua) && /Chrome\/[\d.]+/i.test(ua));

    if (isAndroid && isWebView) {
      var btn = document.getElementById("androidDownloadBtn");
      if (btn) btn.style.display = "none";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hideDownloadInsideAndroidApp);
  } else {
    hideDownloadInsideAndroidApp();
  }
})();
</script>
